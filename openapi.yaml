      x-permissions:
        allOf:
        - guests:write
      x-access-policy: staff-hotel
components:
  schemas:
    AmountRange:
      properties:
        min_value:
          anyOf:
          - type: integer
          - type: 'null'
          title: Min Value
        max_value:
          anyOf:
          - type: integer
          - type: 'null'
          title: Max Value
        currency:
          $ref: '#/components/schemas/Currency'
      additionalProperties: false
      type: object
      required:
      - currency
      title: AmountRange
      description: Inclusive minor-unit bounds, compared only within the given currency.
    AvailabilityWindow:
      properties:
        min_date:
          type: string
          format: date-time
          title: Min Date
          description: Inclusive start of required availability.
        max_date:
          type: string
          format: date-time
          title: Max Date
          description: Exclusive end of required availability.
      additionalProperties: false
      type: object
      required:
      - min_date
      - max_date
      title: AvailabilityWindow
      description: Both bounds are required to find rooms free for the entire interval.
    Bed:
      properties:
        id:
          $ref: '#/components/schemas/BedId'
        type:
          $ref: '#/components/schemas/BedType'
      additionalProperties: false
      type: object
      required:
      - id
      - type
      title: Bed
    BedId:
      type: string
      pattern: ^bed_[0-7][0-9A-HJKMNP-TV-Z]{25}$
    BedType:
      type: string
      enum:
      - bed_type_single
      - bed_type_twin
      - bed_type_double
      - bed_type_queen
      - bed_type_king
