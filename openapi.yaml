          title: Min Value
        max_value:
          anyOf:
          - type: integer
          - type: 'null'
          title: Max Value
        currency:
          $ref: '#/components/schemas/Currency'
      additionalProperties: false
      type: object
      required:
      - currency
      title: AmountRange
      description: Inclusive minor-unit bounds, compared only within the given currency.
    Bed:
