components:
  schemas:
    Activity:
      properties:
        id:
          $ref: '#/components/schemas/ActivityId'
        venue_id:
          $ref: '#/components/schemas/VenueId'
        title:
          type: string
          minLength: 1
          title: Title
        type:
          $ref: '#/components/schemas/ActivityTypeCode'
        description:
          type: string
          title: Description
        date_range:
          $ref: '#/components/schemas/DateRange'
        capacity:
          anyOf:
          - type: integer
            minimum: 0.0
          - type: 'null'
          title: Capacity
          description: Null means no activity-level attendance limit.
        booking_size:
          $ref: '#/components/schemas/BookingSize'
        minimum_age:
          type: integer
          minimum: 0.0
          title: Minimum Age
        price:
          $ref: '#/components/schemas/ActivityPrice'
        reserved_places:
          type: integer
          minimum: 0.0
          title: Reserved Places
          description: Derived count of effective guest reservations, excluding historical
            revisions.
        created_at:
          type: string
          format: date-time
          title: Created At
      additionalProperties: false
      type: object
      required:
      - id
      - venue_id
      - title
      - type
      - description
      - date_range
      - capacity
      - booking_size
      - minimum_age
      - price
      - reserved_places
      - created_at
      title: Activity
      description: One dated event; reservations and venue sharing do not create recurring
        templates.
    ActivityId:
      type: string
      pattern: ^activity_[0-7][0-9A-HJKMNP-TV-Z]{25}$
    ActivityPrice:
      properties:
        price_id:
          $ref: '#/components/schemas/PriceId'
        revision:
          type: integer
          minimum: 1.0
          title: Revision
        amount:
          $ref: '#/components/schemas/NonNegativeAmount'
        unit:
          $ref: '#/components/schemas/ActivityPriceUnit'
      additionalProperties: false
      type: object
      required:
      - price_id
      - revision
      - amount
      - unit
      title: ActivityPrice
    ActivityPriceUnit:
      type: string
      enum:
      - ACTIVITY_PRICE_UNIT_PER_GUEST
      title: ActivityPriceUnit
      description: Pricing unit for an activity rate; the demo currently charges per
        guest.
    ActivityReservation:
      properties:
        id:
          $ref: '#/components/schemas/ActivityReservationId'
        revision:
          type: integer
          minimum: 1.0
          title: Revision
        guest_id:
          $ref: '#/components/schemas/GuestId'
        party_id:
          $ref: '#/components/schemas/PartyId'
        activity:
          $ref: '#/components/schemas/ReservedActivity'
        cancelled:
          type: boolean
          title: Cancelled
          description: Explicit cancellation; an ended activity does not change this
            flag.
        cancellation_reason:
          anyOf:
          - type: string
            minLength: 1
          - type: 'null'
          title: Cancellation Reason
        agreed_price:
          $ref: '#/components/schemas/ActivityPrice'
        effective:
          type: boolean
          title: Effective
          description: True when not cancelled and the parent booking permits it;
            independent of whether the activity has ended.
        created_at:
          type: string
          format: date-time
          title: Created At
      additionalProperties: false
      type: object
      required:
      - id
      - revision
      - guest_id
      - party_id
      - activity
      - cancelled
      - cancellation_reason
      - agreed_price
      - effective
      - created_at
      title: ActivityReservation
      description: One guest's latest reservation revision, attributed to their party.
    ActivityReservationId:
      type: string
      pattern: ^activity_reservation_[0-7][0-9A-HJKMNP-TV-Z]{25}$
    ActivityReservations:
      properties:
        reservations:
          items:
            $ref: '#/components/schemas/ActivityReservation'
          type: array
          title: Reservations
      additionalProperties: false
      type: object
      required:
      - reservations
      title: ActivityReservations
    ActivityTypeCode:
      type: string
      pattern: ^ACTIVITY_TYPE_[A-Z][A-Z0-9_]*$
      description: Code from the activity-types table, such as ACTIVITY_TYPE_TENNIS.
    AddStayRoomRequest:
      properties:
        request_id:
          type: string
          minLength: 1
          title: Request Id
          description: Identifies this logical request; reuse it when retrying.
        payload:
          $ref: '#/components/schemas/StayRoom'
      additionalProperties: false
      type: object
      required:
      - request_id
      - payload
      title: AddStayRoomRequest
    AmendStayRequest:
      properties:
        request_id:
          type: string
          minLength: 1
