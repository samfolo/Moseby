      description: Allowed update_mask entries; values must match payload field names
        exactly.
    UpdateGuestRequest:
      properties:
        request_id:
          type: string
          minLength: 1
          title: Request Id
          description: Identifies this logical request; reuse it when retrying.
        payload:
          $ref: '#/components/schemas/UpdateGuestRequestPayload'
        update_mask:
          items:
            $ref: '#/components/schemas/UpdateGuestFieldMask'
          type: array
          minItems: 1
