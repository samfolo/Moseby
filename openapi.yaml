paths:
  /rooms:
    query:
      summary: Search rooms
      description: Combine filters and return current prices. An availability window
        restricts results to free rooms; no capacity is held.
      operationId: searchRooms
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Page_Room_'
        '501':
          description: Contract draft; operation is not implemented.
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      x-permissions:
        allOf:
        - rooms:read
      x-access-policy: staff-hotel
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SearchRoomsRequest'
  /rooms/{id}:
    get:
      summary: Read a room
      operationId: getRoom
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          pattern: ^room_[0-7][0-9A-HJKMNP-TV-Z]{25}$
          title: Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Room'
        '501':
          description: Contract draft; operation is not implemented.
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      x-permissions:
        allOf:
        - rooms:read
      x-access-policy: staff-hotel
  /guests/{id}:
    get:
      summary: Read a guest
      operationId: getGuest
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          pattern: ^guest_[0-7][0-9A-HJKMNP-TV-Z]{25}$
          title: Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Guest'
        '501':
          description: Contract draft; operation is not implemented.
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      x-permissions:
        allOf:
        - guests:read
      x-access-policy: staff-hotel
    patch:
      summary: Update a guest
      description: Apply the masked fields to the existing guest and validate the
