    RoomId:
      type: string
      pattern: ^room_[0-7][0-9A-HJKMNP-TV-Z]{25}$
    RoomServiceStatus:
      type: string
      enum:
      - room_service_status_in_service
      - room_service_status_out_of_service
      title: RoomServiceStatus
      description: Room condition, independent of reservations and temporary holds.
    SearchRoomsRequest:
      properties:
        request_id:
          type: string
          minLength: 1
          title: Request Id
          description: Identifies this logical request; reuse it when retrying.
        payload:
          $ref: '#/components/schemas/SearchRoomsRequestPayload'
      additionalProperties: false
      type: object
      required:
      - request_id
      - payload
      title: SearchRoomsRequest
    SearchRoomsRequestPayload:
      properties:
        cursor:
          anyOf:
          - type: string
          - type: 'null'
          title: Cursor
          description: Continue the same query.
        limit:
          type: integer
          maximum: 100.0
          minimum: 1.0
          title: Limit
          default: 50
        hotel_id:
          anyOf:
          - $ref: '#/components/schemas/HotelId'
          - type: 'null'
        ids:
          anyOf:
          - items:
              $ref: '#/components/schemas/RoomId'
            type: array
            minItems: 1
          - type: 'null'
          title: Ids
        tier:
          anyOf:
          - type: string
          - type: 'null'
          title: Tier
        bed_types:
          anyOf:
          - items:
              $ref: '#/components/schemas/BedType'
            type: array
            minItems: 1
          - type: 'null'
          title: Bed Types
          description: Match rooms containing every listed bed type.
        number_of_beds:
          anyOf:
          - $ref: '#/components/schemas/NumberRange'
          - type: 'null'
        number_of_bathrooms:
          anyOf:
          - $ref: '#/components/schemas/NumberRange'
          - type: 'null'
        nightly_amount:
          anyOf:
          - $ref: '#/components/schemas/AmountRange'
          - type: 'null'
        service_statuses:
          anyOf:
          - items:
              $ref: '#/components/schemas/RoomServiceStatus'
