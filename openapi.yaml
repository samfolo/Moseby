          description: Unique field names, matching exactly the supplied payload fields.
      additionalProperties: false
      type: object
      required:
      - request_id
      - payload
      - update_mask
      title: UpdateGuestRequest
    UpdateGuestRequestPayload:
      properties:
        first_name:
          type: string
          minLength: 1
          title: First Name
        last_name:
          type: string
          minLength: 1
          title: Last Name
        preferred_name:
          anyOf:
          - type: string
          - type: 'null'
          title: Preferred Name
        age:
          type: integer
          minimum: 0.0
          title: Age
        dietary_requirements:
          anyOf:
          - type: string
          - type: 'null'
          title: Dietary Requirements
        phone:
          anyOf:
          - type: string
          - type: 'null'
          title: Phone
        email:
          anyOf:
          - type: string
          - type: 'null'
          title: Email
        contact_preference:
          anyOf:
          - $ref: '#/components/schemas/ContactPreference'
          - type: 'null'
      additionalProperties: false
      type: object
      title: UpdateGuestRequestPayload
      description: Omitted fields stay unchanged; null clears only nullable guest
        fields.
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
        input:
          title: Input
        ctx:
          type: object
          title: Context
      type: object
      required:
      - loc
      - msg
      - type
      title: ValidationError
