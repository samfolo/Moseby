components:
  schemas:
    Activity:
      properties:
        id:
          $ref: '#/components/schemas/ActivityId'
        venue_id:
          $ref: '#/components/schemas/VenueId'
        title:
          type: string
          minLength: 1
          title: Title
        type:
          $ref: '#/components/schemas/ActivityTypeCode'
        description:
          type: string
          title: Description
        date_range:
          $ref: '#/components/schemas/DateRange'
        capacity:
          anyOf:
          - type: integer
            minimum: 0.0
          - type: 'null'
          title: Capacity
          description: Null means no activity-level attendance limit.
        booking_size:
          $ref: '#/components/schemas/BookingSize'
        minimum_age:
          type: integer
          minimum: 0.0
          title: Minimum Age
        price:
          $ref: '#/components/schemas/ActivityPrice'
        reserved_places:
          type: integer
          minimum: 0.0
          title: Reserved Places
          description: Derived count of effective guest reservations, excluding historical
            revisions.
        created_at:
          type: string
          format: date-time
          title: Created At
      additionalProperties: false
      type: object
      required:
      - id
      - venue_id
      - title
      - type
      - description
      - date_range
      - capacity
      - booking_size
      - minimum_age
      - price
      - reserved_places
      - created_at
      title: Activity
      description: One dated event; reservations and venue sharing do not create recurring
        templates.
    ActivityId:
      type: string
      pattern: ^activity_[0-7][0-9A-HJKMNP-TV-Z]{25}$
    ActivityPrice:
      properties:
        price_id:
          $ref: '#/components/schemas/PriceId'
        revision:
          type: integer
          minimum: 1.0
          title: Revision
        amount:
          $ref: '#/components/schemas/NonNegativeAmount'
        unit:
          $ref: '#/components/schemas/ActivityPriceUnit'
      additionalProperties: false
      type: object
      required:
      - price_id
      - revision
      - amount
      - unit
      title: ActivityPrice
    ActivityPriceUnit:
      type: string
      enum:
      - ACTIVITY_PRICE_UNIT_PER_GUEST
      title: ActivityPriceUnit
      description: Pricing unit for an activity rate; the demo currently charges per
        guest.
    ActivityReservation:
      properties:
        id:
          $ref: '#/components/schemas/ActivityReservationId'
        revision:
          type: integer
          minimum: 1.0
          title: Revision
        guest_id:
          $ref: '#/components/schemas/GuestId'
        party_id:
          $ref: '#/components/schemas/PartyId'
        activity:
          $ref: '#/components/schemas/ReservedActivity'
        cancelled:
          type: boolean
          title: Cancelled
          description: Explicit cancellation; an ended activity does not change this
            flag.
        cancellation_reason:
          anyOf:
          - type: string
            minLength: 1
          - type: 'null'
          title: Cancellation Reason
        agreed_price:
          $ref: '#/components/schemas/ActivityPrice'
        effective:
          type: boolean
          title: Effective
          description: True when not cancelled and the parent booking permits it;
            independent of whether the activity has ended.
        created_at:
          type: string
          format: date-time
          title: Created At
      additionalProperties: false
      type: object
      required:
      - id
      - revision
      - guest_id
      - party_id
      - activity
      - cancelled
      - cancellation_reason
      - agreed_price
      - effective
      - created_at
      title: ActivityReservation
      description: One guest's latest reservation revision, attributed to their party.
    ActivityReservationId:
      type: string
      pattern: ^activity_reservation_[0-7][0-9A-HJKMNP-TV-Z]{25}$
    ActivityTypeCode:
      type: string
      pattern: ^ACTIVITY_TYPE_[A-Z][A-Z0-9_]*$
      description: Code from the activity-types table, such as ACTIVITY_TYPE_TENNIS.
    Address:
      properties:
        line_1:
          anyOf:
          - type: string
          - type: 'null'
          title: Line 1
        line_2:
          anyOf:
          - type: string
          - type: 'null'
          title: Line 2
        city:
          anyOf:
          - type: string
          - type: 'null'
          title: City
        postcode:
          anyOf:
          - type: string
          - type: 'null'
          title: Postcode
        country_code:
          anyOf:
          - type: string
            pattern: ^[A-Z]{2}$
          - type: 'null'
          title: Country Code
          description: Two-letter ISO 3166-1 country code.
      additionalProperties: false
      type: object
      title: Address
      description: Postal location; fields may be absent where they do not apply.
    AgentId:
      type: string
      maxLength: 64
      minLength: 1
      pattern: ^[a-z][a-z0-9]*(?:-[a-z0-9]+)*$
    AmountRange:
      properties:
        min_value:
          anyOf:
          - type: integer
          - type: 'null'
          title: Min Value
        max_value:
          anyOf:
          - type: integer
          - type: 'null'
          title: Max Value
        currency:
          $ref: '#/components/schemas/Currency'
      additionalProperties: false
      type: object
      required:
      - currency
      title: AmountRange
      description: Inclusive minor-unit bounds, compared only within the given currency.
    AssistantConversationRecord:
      properties:
        id:
          $ref: '#/components/schemas/ThreadRecordId'
        thread_id:
          $ref: '#/components/schemas/ThreadId'
        sequence:
          type: integer
          minimum: 2.0
          title: Sequence
        created_at:
          type: string
          format: date-time
          title: Created At
        run_id:
          $ref: '#/components/schemas/RunId'
        actor_staff_member_id:
          anyOf:
          - $ref: '#/components/schemas/StaffMemberId'
          - type: 'null'
        kind:
          type: string
          const: THREAD_RECORD_KIND_ASSISTANT_MESSAGE
          title: Kind
        payload:
          $ref: '#/components/schemas/AssistantMessagePayload'
      additionalProperties: false
      type: object
      required:
      - id
      - thread_id
      - sequence
      - created_at
      - run_id
      - actor_staff_member_id
      - kind
      - payload
      title: AssistantConversationRecord
    AssistantMessagePayload:
      properties:
        text:
          anyOf:
          - type: string
            minLength: 1
          - type: 'null'
          title: Text
        tool_calls:
          items:
            $ref: '#/components/schemas/ToolCall'
          type: array
          title: Tool Calls
      additionalProperties: false
      type: object
      title: AssistantMessagePayload
    Bed:
      properties:
        id:
          $ref: '#/components/schemas/BedId'
        type:
          $ref: '#/components/schemas/BedType'
      additionalProperties: false
      type: object
      required:
      - id
      - type
      title: Bed
    BedId:
      type: string
      pattern: ^bed_[0-7][0-9A-HJKMNP-TV-Z]{25}$
    BedType:
      type: string
      enum:
      - BED_TYPE_UNKNOWN
      - BED_TYPE_SINGLE
      - BED_TYPE_TWIN
      - BED_TYPE_DOUBLE
      - BED_TYPE_QUEEN
      - BED_TYPE_KING
      title: BedType
      description: Supported bed categories; dimensions and sleeping capacity are
        defined separately.
    Booking:
      properties:
        id:
          $ref: '#/components/schemas/BookingId'
        hotel_id:
          $ref: '#/components/schemas/HotelId'
        name:
          type: string
          minLength: 1
          title: Name
        revision:
          type: integer
          minimum: 1.0
          title: Revision
          description: Revision supplying the current booking status.
        status:
          $ref: '#/components/schemas/BookingStatus'
        cancellation_reason:
          anyOf:
          - type: string
            minLength: 1
          - type: 'null'
          title: Cancellation Reason
        room_reservations:
          items:
            $ref: '#/components/schemas/RoomReservation'
          type: array
          minItems: 1
          title: Room Reservations
        created_at:
          type: string
          format: date-time
          title: Created At
      additionalProperties: false
      type: object
      required:
      - id
      - hotel_id
      - name
      - revision
      - status
      - cancellation_reason
      - room_reservations
      - created_at
      title: Booking
      description: A confirmed stay; technical failures belong to operations, not
        booking status.
    BookingId:
      type: string
      pattern: ^booking_[0-7][0-9A-HJKMNP-TV-Z]{25}$
    BookingSize:
      properties:
        min_value:
          type: integer
          minimum: 1.0
          title: Min Value
        max_value:
          type: integer
          minimum: 1.0
          title: Max Value
      additionalProperties: false
      type: object
      required:
      - min_value
      - max_value
      title: BookingSize
      description: Allowed size of a group request, not the size of each reservation
        row.
    BookingStatus:
      type: string
      enum:
      - BOOKING_STATUS_CONFIRMED
      - BOOKING_STATUS_CANCELLED
      - BOOKING_STATUS_COMPLETED
      title: BookingStatus
      description: A proposed amendment leaves the accepted booking confirmed until
        committed.
    CancelActivityReservationRequest:
      properties:
        request_id:
          type: string
          minLength: 1
          title: Request Id
          description: Identifies this logical request; reuse it when retrying.
        payload:
          $ref: '#/components/schemas/CancelActivityReservationRequestPayload'
      additionalProperties: false
      type: object
      required:
      - request_id
      - payload
      title: CancelActivityReservationRequest
    CancelActivityReservationRequestPayload:
      properties:
        reason:
          type: string
          minLength: 1
          title: Reason
      additionalProperties: false
      type: object
      required:
      - reason
      title: CancelActivityReservationRequestPayload
    CancelIncomingThreadRecordRequest:
      properties:
        request_id:
          type: string
          minLength: 1
          title: Request Id
          description: Identifies this logical request; reuse it when retrying.
        payload:
          $ref: '#/components/schemas/CancelIncomingThreadRecordRequestPayload'
      additionalProperties: false
      type: object
      required:
      - request_id
      - payload
      title: CancelIncomingThreadRecordRequest
      description: Direct user action for pending input before acceptance into history.
    CancelIncomingThreadRecordRequestPayload:
      properties: {}
      additionalProperties: false
      type: object
      title: CancelIncomingThreadRecordRequestPayload
      description: Withdraw pending user input; the authenticated staff member is
        recorded.
    CancelRunRequest:
      properties:
        request_id:
          type: string
          minLength: 1
          title: Request Id
          description: Identifies this logical request; reuse it when retrying.
        payload:
          $ref: '#/components/schemas/CancelRunRequestPayload'
      additionalProperties: false
      type: object
      required:
      - request_id
      - payload
      title: CancelRunRequest
    CancelRunRequestPayload:
      properties: {}
      additionalProperties: false
      type: object
      title: CancelRunRequestPayload
      description: Request a stop; the service records the time and authenticated
        staff member.
    CancelledToolResultPayload:
      properties:
        job_id:
          anyOf:
          - $ref: '#/components/schemas/JobId'
          - type: 'null'
          description: Job producing the result when execution was queued.
        status:
          type: string
          const: TOOL_RESULT_STATUS_CANCELLED
          title: Status
        reason:
          type: string
          minLength: 1
          title: Reason
      additionalProperties: false
      type: object
      required:
      - status
      - reason
      title: CancelledToolResultPayload
    ContactPreference:
      type: string
      enum:
      - CONTACT_PREFERENCE_PHONE
      - CONTACT_PREFERENCE_EMAIL
      title: ContactPreference
      description: Preferred contact channel; null on the guest selects all supplied
        channels.
    ConversationRecord:
      oneOf:
      - $ref: '#/components/schemas/UserConversationRecord'
      - $ref: '#/components/schemas/AssistantConversationRecord'
      - $ref: '#/components/schemas/ToolResultConversationRecord'
      discriminator:
        propertyName: kind
        mapping:
          THREAD_RECORD_KIND_ASSISTANT_MESSAGE: '#/components/schemas/AssistantConversationRecord'
          THREAD_RECORD_KIND_TOOL_RESULT: '#/components/schemas/ToolResultConversationRecord'
          THREAD_RECORD_KIND_USER_MESSAGE: '#/components/schemas/UserConversationRecord'
    CreateIncomingThreadRecordRequest:
      properties:
        request_id:
          type: string
