        - Moseby:read
      x-hotel-scoped: true
    patch:
      summary: Update a guest
      description: Apply the masked fields to the existing guest and validate the
        resulting guest before saving.
      operationId: updateGuest
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          pattern: ^guest_[0-7][0-9A-HJKMNP-TV-Z]{25}$
          title: Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateGuestRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Guest'
        '501':
          description: Contract draft; operation is not implemented.
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      x-permissions:
        anyOf:
        - Moseby.guests:write
        - Moseby:write
