    BookingId:
      type: string
      pattern: ^booking_[0-7][0-9A-HJKMNP-TV-Z]{25}$
    BookingSize:
      properties:
        min_value:
          type: integer
          minimum: 1.0
          title: Min Value
        max_value:
          type: integer
          minimum: 1.0
          title: Max Value
      additionalProperties: false
      type: object
      required:
      - min_value
