        schema:
          type: string
          pattern: ^guest_[0-7][0-9A-HJKMNP-TV-Z]{25}$
          title: Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateGuestRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
