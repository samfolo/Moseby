      description: Supported bed categories; dimensions and sleeping capacity are
        defined separately.
    ContactPreference:
      type: string
      enum:
      - contact_preference_phone
      - contact_preference_email
      title: ContactPreference
      description: Preferred contact channel; null on the guest selects all supplied
        channels.
    Currency:
      type: string
      pattern: ^[A-Z]{3}$
      description: ISO 4217 currency code, such as GBP.
    Guest:
      properties:
        id:
          $ref: '#/components/schemas/GuestId'
        party_id:
          $ref: '#/components/schemas/PartyId'
          description: Party for this stay; immutable membership.
        first_name:
          type: string
          minLength: 1
          title: First Name
        last_name:
          type: string
          minLength: 1
          title: Last Name
        preferred_name:
          anyOf:
          - type: string
          - type: 'null'
          title: Preferred Name
        age:
          type: integer
          minimum: 0.0
          title: Age
          description: Recorded age for activity eligibility.
        dietary_requirements:
          anyOf:
          - type: string
          - type: 'null'
          title: Dietary Requirements
          description: Reported dietary requirements in the staff member's own words.
        phone:
          anyOf:
          - type: string
          - type: 'null'
          title: Phone
        email:
          anyOf:
          - type: string
          - type: 'null'
          title: Email
        contact_preference:
          anyOf:
          - $ref: '#/components/schemas/ContactPreference'
          - type: 'null'
          description: Null uses every supplied channel; a preference requires that
            contact.
      additionalProperties: false
      type: object
      required:
      - id
      - party_id
      - first_name
      - last_name
      - preferred_name
      - age
      - dietary_requirements
      - phone
      - email
      - contact_preference
      title: Guest
      description: One person during one stay; returning visitors receive new guest
        IDs.
    GuestId:
      type: string
      pattern: ^guest_[0-7][0-9A-HJKMNP-TV-Z]{25}$
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    HotelId:
      type: string
      pattern: ^hotel_[0-7][0-9A-HJKMNP-TV-Z]{25}$
    NightlyPrice:
      properties:
        price_id:
          $ref: '#/components/schemas/PriceId'
          description: Shared price identity across revisions.
        revision:
          type: integer
          minimum: 1.0
          title: Revision
          description: Version of the displayed nightly rate.
        amount:
          $ref: '#/components/schemas/NonNegativeAmount'
      additionalProperties: false
      type: object
      required:
      - price_id
      - revision
      - amount
      title: NightlyPrice
    NonNegativeAmount:
      properties:
        value:
          type: integer
          minimum: 0.0
          title: Value
          description: Nonnegative integer currency minor units.
        currency:
          $ref: '#/components/schemas/Currency'
      additionalProperties: false
      type: object
      required:
      - value
      - currency
      title: NonNegativeAmount
      description: A price that cannot be negative; zero permits complimentary items.
    NumberRange:
      properties:
        min_value:
          anyOf:
          - type: integer
          - type: 'null'
          title: Min Value
        max_value:
          anyOf:
          - type: integer
          - type: 'null'
          title: Max Value
      additionalProperties: false
      type: object
      title: NumberRange
      description: Inclusive integer bounds; omit either bound for an open-ended range.
    Page_Room_:
      properties:
        items:
          items:
            $ref: '#/components/schemas/Room'
          type: array
          title: Items
        next_cursor:
          anyOf:
          - type: string
          - type: 'null'
          title: Next Cursor
          description: Opaque continuation token; null means there are no more results.
      additionalProperties: false
      type: object
      required:
      - items
      - next_cursor
      title: Page[Room]
    PartyId:
      type: string
      pattern: ^party_[0-7][0-9A-HJKMNP-TV-Z]{25}$
    PriceId:
      type: string
      pattern: ^price_[0-7][0-9A-HJKMNP-TV-Z]{25}$
    Room:
      properties:
        id:
          $ref: '#/components/schemas/RoomId'
        hotel_id:
          $ref: '#/components/schemas/HotelId'
        label:
          type: string
          minLength: 1
          title: Label
          description: Room number or name as shown to guests.
        description:
          type: string
          title: Description
        tier:
          anyOf:
          - type: string
          - type: 'null'
          title: Tier
        number_of_bathrooms:
          type: integer
          minimum: 0.0
          title: Number Of Bathrooms
        service_status:
          $ref: '#/components/schemas/RoomServiceStatus'
        beds:
          items:
            $ref: '#/components/schemas/Bed'
          type: array
          title: Beds
        price:
          $ref: '#/components/schemas/NightlyPrice'
