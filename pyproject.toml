[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "moseby"
version = "0.1.0"
description = "A proactive resort operations experiment."
requires-python = ">=3.14"
dependencies = [
    "fastapi==0.141.1",
    "pydantic==2.13.5",
    "SQLAlchemy==2.0.54",
    "alembic==1.20.0",
]

[project.optional-dependencies]
contract = ["PyYAML==6.0.3"]
dev = ["ruff==0.16.8"]

[tool.ruff]
target-version = "py314"
line-length = 88

[tool.ruff.lint]
# Basic errors, unused names, import ordering and common bug patterns.
select = ["E4", "E7", "E9", "F", "I", "B"]
